spring.application.name=product-service
spring.mongodb.uri=mongodb://localhost:27017/test
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
server.port=0

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Ensure HTTP clients (WebClient/RestTemplate/Feign) propagate trace headers downstream
management.tracing.propagation.type=b3

# If product-service also uses Kafka, enable producer observation here too:
spring.kafka.template.observation-enabled=true